services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vmrb
      POSTGRES_DB: vmrb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmrb -d vmrb"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: base
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://vmrb:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/vmrb
      STORAGE_ROOT: /data
    volumes:
      - medical-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  medical-data:
