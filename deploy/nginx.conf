events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Exclude query strings, request bodies and Authorization headers from access logs.
    log_format privacy '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /var/log/nginx/access.log privacy;
    error_log /var/log/nginx/error.log crit;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=resolve:10m rate=2r/s;

    upstream api { server backend:8000; }

    server {
        listen 80;
        client_max_body_size 513m;
        client_body_timeout 60s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_cache off;
        limit_req_status 429;

        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://api;
        }
        location = /api/v1/doctor/patients/resolve {
            limit_req zone=resolve burst=5 nodelay;
            proxy_pass http://api;
        }
        location /api/ { proxy_pass http://api; }
        location = /health { proxy_pass http://api; }

        # Keep API documentation paths closed even when the SPA fallback is enabled.
        location = /docs { return 404; }
        location = /openapi.json { return 404; }
        location = /redoc { return 404; }

        root /usr/share/nginx/html;
        # Hashed Vite chunks must 404 when stale, never fall back to index.html
        # (that returns HTML as JS and breaks dynamic import).
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location /models/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=86400";
        }
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        error_page 413 = @too_large;
        error_page 429 = @rate_limit;
        error_page 502 504 = @upstream_error;
        location @too_large {
            default_type application/json;
            add_header Cache-Control no-store always;
            return 413 '{"code":41301,"message":"Request body exceeds limit","data":null}';
        }
        location @rate_limit {
            default_type application/json;
            add_header Retry-After 1 always;
            add_header Cache-Control no-store always;
            return 429 '{"code":42901,"message":"Too many requests","data":null}';
        }
        location @upstream_error {
            default_type application/json;
            add_header Cache-Control no-store always;
            return 502 '{"code":50202,"message":"Backend unavailable","data":null}';
        }
    }
}
