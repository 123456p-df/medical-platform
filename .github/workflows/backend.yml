name: backend
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vmrb
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: vmrb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vmrb -d vmrb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: PostgreSQL migration and integration checks
        env:
          DATABASE_URL: postgresql+psycopg://vmrb:test-only-password@localhost:5432/vmrb_test
          TEST_DATABASE_URL: postgresql+psycopg://vmrb:test-only-password@localhost:5432/vmrb_test
        run: |
          uv run python -m app.cli init-config
          uv run alembic upgrade head
          uv run alembic check
          uv run pytest -q
          uv run alembic downgrade base
          uv run alembic upgrade head
