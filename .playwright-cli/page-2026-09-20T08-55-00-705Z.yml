            - generic [ref=f2e264]: "RadSight 分析完成。接下来核对病历： 会诊完成，报告卡片已生成。以下为总结： ## 一、序列选择理由 - **选用序列：`study_img_4033546db10f49dd84b1f62e89fa83f5` / 文件 `img_4033546db10f49dd84b1f62e89fa83f5.nii.gz`**（2026-09-20，128 层，1mm 各向同性重建） - 对比三个序列（09-13、09-19、09-20，均为 lung 描述）：本次为**日期最新**的检查，且字段覆盖上腹部（分割结果含肾上腺层面以下的肝、脾、肾、主动脉等），能同时满足肺动脉/肺实质与肾上腺的评估需求；09-19 记录明确为\"复查未见新发病灶\"的基线随访片，信息量不及本次。 - **局限提示**：列表描述均为\"lung\"平扫序列，非 CTPA，评估肺栓塞能力天然受限。 ## 二、影像结论（均来自 RadSight-8B 容积分析原文，未套模板） 1. **未见肺动脉栓塞或急性胸部病变征象**；但平扫排除 PE 敏感性有限，临床高度怀疑时仍需 CTPA。 2. **左肾上腺结节**：轴位约 **2.8 × 2.1 cm**，体积约 1.6 cc——性质待证实（腺瘤/转移/增生待排），建议肾上腺专用增强 CT 或化学位移 MRI + 内分泌功能评估。 3. **右肺中叶结节**：约 **0.7 × 0.6 cm**，体积约 0.2 cc；未做 LU-RADS 分级（平扫+质控失败，特征评估受限）。 4. **分割质控整体 failed**：肝脏体积报告 3569.4 mL 被标记为 **implausible**（明显异常，考虑分割溢出，**不能诊断肝肿大**）；双肾、双肺各叶、心脏体积同样不可信。脾、胰、主动脉、下腔静脉等分割完成。 ## 三、与病史一致性 - 男性 46 岁，**吸烟 20 支/日 × 30 年（约 30 包年）**、慢性支气管炎 5 年——属肺癌高危人群，右肺中叶 7mm 结节在此背景下**不能忽视**，需规范随访；咳嗽症状与慢支病史相符，但**单发 7mm 小结节通常不足以解释干咳**，胸闷亦无急性影像解释（无 PE、无气胸、无心包积液证据）。 - 2026-09-12 基线与 09-19 复查均记录\"未见新发实质性病灶\"，本次（09-20）RadSight 检出右肺中叶小结节，建议主诊医师**与 09-19 序列逐层对比**确认是否为新发或此前未标注。 - 左肾上腺结节约 2.8 cm，超出偶发微小结节范畴，与呼吸症状无关，属**独立需追查的腹部所见**。 ⚠️ 以上为供主诊医师复核的草案，非正式诊断；建议优先处理：①PE 临床概率评估（必要时 CTPA）②肾上腺结节定性 ③肺结节对比旧片后定随访方案 ④重跑/校正 3D 分割。"
